# This workflow automates the creation of Specification Documents
# which will be copied into https://github.com/jakartaee/specifications

name: Generate specification documentation

on: 
    workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: 17
        distribution: 'temurin'
        cache: maven
    - name: Generate specification docs
      run: |
        mvn package --file api/pom.xml
        mvn package --file spec/pom.xml
    - name: Assemble documentation
      run: |
        mkdir documentation/
        cp spec/target/generated-docs/jakarta-json-bind.pdf \
           documentation/jakarta-json-bind.pdf
        cp spec/target/generated-docs/jakarta-json-bind.html \
          documentation/jakarta-json-bind.html

        cp -r api/target/reports/apidocs/ documentation/apidocs
    - name: Upload documentation
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Specification Documentation
        path: documentation/
        if-no-files-found: error